<main class="mr-discovery"><section class="mr-discovery-hero"><div class="mr-discovery-kicker">Especiales</div><h1 id="tituloColeccion">Colecciones</h1><p class="mr-discovery-sub" id="descripcionColeccion">Listas temáticas para descubrir varios juegos de una misma saga, estilo o época.</p><div id="listaColecciones" class="mr-discovery-tools"></div></section><section class="mr-section"><div class="mr-section-head"><h2 id="subtituloColeccion">Juegos de la colección</h2><a href="juegos.html">Ver todo →</a></div><div id="juegosColeccion" class="mr-game-grid"></div></section></main>

<script>document.addEventListener("DOMContentLoaded",()=>{const slug=(new URLSearchParams(location.search).get("coleccion")||"").toLowerCase();const defs=[{slug:"pokemon",nombre:"Pokémon",icono:"⚡",tokens:["pokémon","pokemon"]},{slug:"mario",nombre:"Mario",icono:"🍄",tokens:["mario"]},{slug:"zelda",nombre:"The Legend of Zelda",icono:"🗡️",tokens:["zelda"]},{slug:"retro",nombre:"Retro y clásicos",icono:"👾",tokens:["retro","nintendo 64","playstation","mega man","sonic"]},{slug:"terror",nombre:"Terror",icono:"👻",tokens:["terror","resident","isaac","doom"]},{slug:"anime",nombre:"Anime y manga",icono:"🔥",tokens:["dragon ball","naruto","anime","one piece","ben 10"]}];const chips=document.getElementById("listaColecciones");chips.innerHTML=defs.map(d=>`<a class="mr-chip" href="coleccion.html?coleccion=${encodeURIComponent(d.slug)}">${d.icono} ${d.nombre}</a>`).join("");const actual=defs.find(d=>d.slug===slug)||defs[3];document.getElementById("tituloColeccion").textContent=actual.nombre;document.getElementById("subtituloColeccion").textContent=`${actual.nombre} · colección`;const lista=juegos.filter(j=>{const t=(j.nombre+" "+j.descripcion+" "+j.categoria).toLowerCase();return actual.tokens.some(x=>t.includes(x.toLowerCase()));});window.MRDescubrimiento.renderLista(document.getElementById("juegosColeccion"),lista);});</script>
