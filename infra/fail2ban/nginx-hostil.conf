# Peticiones a rutas que en este sitio no existen y nunca van a existir.
# MacroReborn es HTML, JavaScript y una API en Node: no tiene PHP, ni
# WordPress, ni panel de administracion del servidor. Quien pide esas rutas
# no esta navegando, esta buscando vulnerabilidades.
#
# Este filtro existe porque los que trae fail2ban no cubren el caso:
# `nginx-bad-request` solo cuenta respuestas 400, y la lista de rutas de
# `nginx-botsearch` no incluye ninguna de las que nos llegaron de verdad
# (.env, .git/config, /v2/_catalog, /telescope/requests, /actuator/env...).
# Comprobado con fail2ban-regex sobre el log real: de las 64 peticiones de un
# escaneo, entre los dos filtros de serie cazaban 2.
#
# No se filtra por codigo de respuesta a proposito. Si alguna de estas rutas
# llegara a devolver 200 el problema seria mayor, no menor.

[Definition]

hostil = [^"]*(\.php|\.env|\.git|\.aws|\.ssh|\.DS_Store|\.vscode|\.svn|wp-|xmlrpc|phpmyadmin|myadmin|adminer|/administrator|/actuator|/telescope|/server-status|/trace\.axd|/v2/_catalog|/console/|/login\.action|/cgi-bin|/vendor/|/backup|/shell|/config\.json|/debug/|/@vite|/ecp/|/owa/|/solr|/jenkins|/druid|/hudson|/struts|/CFIDE|/manager/html|/_profiler|/eval-stdin)[^"]*

failregex = ^<HOST> \- \S+ \[\] "(GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH|CONNECT) <hostil>" \d+ \d+

ignoreregex =
