# Limites de peticiones y compresion para MacroReborn.
# Sustituye parte de lo que antes absorbia la red de Vercel.

# Zonas de control de ritmo. Cada IP tiene su propio contador.
# 10 MB de memoria guardan unas 160.000 IPs distintas.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;

# Los estaticos van en su propia zona: un pico de imagenes no debe consumir
# el colchon que necesitan las paginas y la API. Ritmo alto a proposito,
# porque una sola pagina puede pedir cientos de ficheros de golpe.
limit_req_zone $binary_remote_addr zone=estaticos:10m rate=200r/s;

# Maximo de conexiones simultaneas por IP.
limit_conn_zone $binary_remote_addr zone=porip:10m;

# Respuesta cuando alguien pasa el limite: 429 en vez del 503 por defecto,
# que es lo que un cliente bien hecho entiende como "vas muy rapido".
limit_req_status 429;
limit_conn_status 429;

# Comprimir tambien las respuestas JSON de la API.
# Sin esto solo se comprimia el HTML: cada /api/users enviaba 1,38 MB en crudo.
gzip_types text/plain text/css text/xml text/javascript
           application/json application/javascript application/xml+rss
           application/rss+xml image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_vary on;
