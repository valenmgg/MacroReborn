# Limites de peticiones y compresion para MacroReborn.
# Sustituye parte de lo que antes absorbia la red de Vercel.

# Zonas de control de ritmo. Cada IP tiene su propio contador.
# 10 MB de memoria guardan unas 160.000 IPs distintas.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;

# Los estaticos van en su propia zona: un pico de imagenes no debe consumir
# el colchon que necesitan las paginas y la API. Ritmo alto a proposito,
# porque una sola pagina puede pedir cientos de ficheros de golpe.
limit_req_zone $binary_remote_addr zone=estaticos:10m rate=200r/s;

# Maximo de conexiones simultaneas por IP.
limit_conn_zone $binary_remote_addr zone=porip:10m;

# Respuesta cuando alguien pasa el limite: 429 en vez del 503 por defecto,
# que es lo que un cliente bien hecho entiende como "vas muy rapido".
limit_req_status 429;
limit_conn_status 429;

# Cache en disco de las prendas de avatar.
#
# Las prendas dejaron de ser ficheros en imagenes/ y ahora salen de
# Postgres a traves de Node (migracion 018). Antes las servia nginx
# directo desde disco, que es casi gratis; sin esta cache, cada imagen
# que no este en el navegador del visitante llega hasta el proceso y
# hasta la base. Una pagina de comunidad con 20 avatares son cientos de
# peticiones, y esta maquina tiene 950 MB y dos nucleos.
#
# Con esto la primera peticion de cada dibujo la paga Node y el resto
# las sirve nginx desde disco, igual de barato que antes.
#
# 200 MB de tope sobran de largo: el catalogo entero son 2,8 MB, porque
# las 635 prendas comparten solo 418 archivos. inactive=365d porque la
# URL lleva la huella del contenido y por tanto nunca caduca: si el
# dibujo cambia, cambia la URL.
proxy_cache_path /var/cache/nginx/prendas
                 levels=1:2
                 keys_zone=prendas:10m
                 max_size=200m
                 inactive=365d
                 use_temp_path=off;

# Comprimir tambien las respuestas JSON de la API.
# Sin esto solo se comprimia el HTML: cada /api/users enviaba 1,38 MB en crudo.
gzip_types text/plain text/css text/xml text/javascript
           application/json application/javascript application/xml+rss
           application/rss+xml image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_vary on;
