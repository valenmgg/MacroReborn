# Mapea las peticiones de login para poder limitarlas aparte.
# El limite de nginx va por ruta, y aqui la accion viene en el parametro.
map $request_uri $es_login {
    default              0;
    ~*action=login       1;
    ~*action=register    1;
}

server {
    server_name macroreborn.com www.macroreborn.com 172.184.203.20;

    client_max_body_size 10M;

    # No anunciar la version exacta de nginx.
    server_tokens off;

    # Cabeceras de seguridad del navegador.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximo 40 conexiones simultaneas por IP.
    limit_conn porip 40;

    # Login y registro: 5 intentos por minuto y por IP.
    # Es la barrera contra la fuerza bruta sobre las contrasenas.
    location = /api/auth {
        limit_req zone=login burst=5 nodelay;
        limit_req zone=general burst=60;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        # 30 peticiones por segundo, con margen para 60 de golpe.
        # Una visita normal dispara 12-15 peticiones, asi que sobra.
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/macroreborn.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/macroreborn.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.macroreborn.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = macroreborn.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name macroreborn.com www.macroreborn.com 172.184.203.20;
    return 404; # managed by Certbot
}
