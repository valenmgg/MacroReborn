# Mapea las peticiones de login para poder limitarlas aparte.
# El limite de nginx va por ruta, y aqui la accion viene en el parametro.
map $request_uri $es_login {
    default              0;
    ~*action=login       1;
    ~*action=register    1;
}

server {
    server_name macroreborn.com www.macroreborn.com 172.184.203.20;

    client_max_body_size 10M;

    # No anunciar la version exacta de nginx.
    server_tokens off;

    # Cabeceras de seguridad del navegador.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximo 40 conexiones simultaneas por IP.
    limit_conn porip 40;

    # Segunda barrera para los archivos que no deben salir. La primera esta en
    # server.js (funcion `esPublico`); esta cubre el caso de que alguien toque
    # esa funcion sin darse cuenta, y ademas evita que estas peticiones lleguen
    # siquiera a Node. La raiz del sitio es la raiz del proyecto, asi que sin
    # esto se sirve el `.env`, la carpeta `.git` y el codigo del servidor.
    location ~ /\. {
        access_log off;
        return 404;
    }

    # OJO: aqui no puede ir `api`. Un location con expresion regular gana al
    # prefijo `/`, asi que bloquearia las rutas reales de la API. Esa carpeta
    # ya esta cubierta en server.js, que trata todo lo que empieza por `/api/`
    # como una llamada a la API y nunca lee archivos de ahi.
    location ~* ^/(migrations|scripts|tests|docs|infra|respaldos|node_modules)/ {
        return 404;
    }

    location ~* ^/(package.*|server\.js|cluster\.js|.*\.(md|sql|log|pem|key|gz|env))$ {
        return 404;
    }

    # Login y registro: 5 intentos por minuto y por IP.
    # Es la barrera contra la fuerza bruta sobre las contrasenas.
    location = /api/auth {
        limit_req zone=login burst=5 nodelay;
        limit_req zone=general burst=60;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # La API de contenidos, que es por donde entran las subidas.
    #
    # Existe por el tamano del cuerpo. nginx no tenia client_max_body_size
    # en ningun sitio, asi que regia el valor por defecto: 1 MB. Eso ya
    # rompia algo que nadie habia notado: el avatar PNG del administrador
    # admite hasta 1 MB de imagen, pero viaja en base64 dentro de un JSON,
    # que engorda un tercio. Al llegar cerca del tope documentado, nginx lo
    # rechazaba con un 413 antes de que Node lo viera.
    #
    # Se sube solo aqui, no en todo el servidor: el resto de rutas siguen
    # con 1 MB, que es lo que les corresponde. Y server.js tiene su propio
    # tope de 12 MB, que es el que de verdad protege al proceso.
    #
    # Al ser un location propio hay que repetir el limite de ritmo de
    # location /, porque ya no se cae en el.
    location = /api/content {
        client_max_body_size 12m;
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Los avisos en vivo. Es una respuesta que NO TERMINA: se abre y se
    # queda escribiendo una linea cada vez que hay algo que contar, a
    # veces durante horas. Las tres directivas de abajo existen porque el
    # resto del fichero da por hecho lo contrario.
    #
    #   proxy_buffering off  - por defecto nginx acumula la respuesta del
    #     backend en su buffer y la suelta cuando termina. Con algo que no
    #     termina, eso es no soltar nada nunca. La respuesta tambien manda
    #     X-Accel-Buffering: no, que hace lo mismo; van las dos porque una
    #     es la intencion del sitio y la otra la del programa, y el dia que
    #     este bloque se pierda en una reinstalacion la cabecera lo salva.
    #
    #   proxy_read_timeout  - los 60s del resto cortarian la conexion cada
    #     minuto. El latido de 25s ya lo evitaria, pero una hora deja que
    #     el latido sea una red de seguridad y no el unico sosten.
    #
    #   limit_req  - hay que repetirlo, como en /api/content: al ser un
    #     location propio ya no se cae en el de location /. El burst es
    #     mas corto porque aqui una visita abre UNA conexion, no doce.
    location = /api/avisos {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Prendas de avatar servidas desde la base (migracion 018).
    #
    # Se les da ruta propia en vez de dejarlas en /api/content?action=...
    # por tres motivos, todos practicos:
    #
    #   1. Zona de ritmo. Una pagina de comunidad puede pedir cientos de
    #      imagenes de golpe. En la zona `general` (30/s) eso daria 429;
    #      van a `estaticos` (200/s), que existe justo para esto.
    #   2. Clave de cache limpia: la ruta ES la clave, sin depender de
    #      como venga ordenada la cadena de consulta.
    #   3. No se cachea por accidente el resto de /api/content, que son
    #      comentarios, chat y notificaciones. Servir eso desde cache
    #      seria un fallo grave.
    #
    # El nombre del fichero es la huella SHA-256 del dibujo, asi que dos
    # prendas de modelos distintos con el mismo dibujo comparten URL y el
    # navegador se la baja una sola vez. En el catalogo real eso son 635
    # prendas sobre 418 archivos.
    #
    # `^~` hace que este bloque gane a la expresion regular de estaticos
    # de mas abajo, que si no capturaria el .png. Asi no depende del
    # orden en que esten escritos.
    location ^~ /prendas/ {
        # La expresion va entre comillas a proposito: sin ellas, nginx
        # interpreta la llave de {64} como el comienzo de un bloque y
        # falla con "directive rewrite is not terminated by ;".
        rewrite "^/prendas/([a-f0-9]{64})\.png$" /api/content?action=avatar-prenda&v=$1 break;

        limit_req zone=estaticos burst=600 nodelay;
        limit_conn porip 100;

        proxy_cache prendas;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 365d;
        proxy_cache_valid 404 1m;
        # Si veinte visitantes piden a la vez un dibujo que no esta en
        # cache, solo uno llega a Node; los demas esperan a esa copia.
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;

        # HIT / MISS / EXPIRED. Sirve para comprobar de un vistazo que la
        # cache esta trabajando: curl -I y mirar esta cabecera.
        add_header X-Cache-Prendas $upstream_cache_status always;
        access_log off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Codigo del navegador (.js y .css): SE REVALIDA.
    #
    # Estaba junto con las imagenes, con `immutable` 30 dias. Eso
    # significaba que un cambio en el codigo tardaba hasta un mes en
    # llegar a quien ya habia visitado el sitio, porque immutable evita
    # incluso la peticion condicional: el navegador ni pregunta.
    #
    # Y hay algo peor que la lentitud. El HTML no esta cacheado y el JS
    # si, asi que un visitante podia recibir el HTML nuevo con el
    # JavaScript viejo. Mientras el HTML y el JS se toquen por separado
    # eso da igual, pero en cuanto uno depende del otro —por ejemplo, un
    # perfil.html que ya no trae los divs del catalogo y un perfil.js
    # cacheado que espera encontrarlos— la pagina se rompe para unos si y
    # para otros no, que es la peor forma de romperse.
    #
    # Ahora: fresco 5 minutos, y despues se pregunta. Como server.js
    # manda ETag, esa pregunta se contesta con un 304 vacio y no con una
    # descarga. Un despliegue llega a todo el mundo en 5 minutos sin que
    # nadie tenga que acordarse de poner versiones en las URLs.
    location ~* \.(css|js)$ {
        limit_req zone=estaticos burst=600 nodelay;
        limit_conn porip 100;

        # Sin "always": add_header con always se lo pega tambien a las
        # respuestas de error, y un 404 no debe decir nada sobre cuanto
        # se puede cachear.
        add_header Cache-Control "public, max-age=300, must-revalidate";
        access_log off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_read_timeout 60s;
    }

    # Imagenes, tipografias y medios: se cachean en el navegador y no se
    # revalidan en cada visita. immutable evita incluso la peticion
    # condicional. Aqui si es seguro: estos ficheros no se editan en
    # sitio, se agregan o se reemplazan por otros con otro nombre.
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|mp3|ogg|mp4)$ {
        limit_req zone=estaticos burst=600 nodelay;
        limit_conn porip 100;

        # SIN "always", y esto importa mucho mas de lo que parece.
        #
        # add_header con always se lo pega tambien a los 404. El
        # resultado era que una imagen que no existe se cacheaba como
        # "immutable" 30 dias: el navegador se guardaba el 404 y no
        # volvia a preguntar nunca. Si esa imagen aparecia despues -que
        # es exactamente lo que pasa cuando el equipo de arte sube una
        # prenda- seguia rota un mes para quien la hubiera pedido antes.
        #
        # Paso de verdad: dos prendas subidas desde el panel seguian
        # dando 404 en un navegador cuando ya devolvian 200 en el
        # servidor.
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        # 30 peticiones por segundo, con margen para 60 de golpe.
        # Una visita normal dispara 12-15 peticiones, asi que sobra.
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # HTTP/2. Sin esto el navegador negocia HTTP/1.1, que solo abre unas
    # 6 conexiones por dominio: perfil.html pide 41 ficheros entre scripts
    # y estilos, asi que avanzaban de seis en seis. Con HTTP/2 van todos
    # multiplexados por una sola conexion.
    #
    # nginx 1.24 lo pide asi, en la propia linea listen. Desde 1.25.1 la
    # forma buena es la directiva "http2 on;".
    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/macroreborn.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/macroreborn.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.macroreborn.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = macroreborn.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name macroreborn.com www.macroreborn.com 172.184.203.20;
    return 404; # managed by Certbot
}
